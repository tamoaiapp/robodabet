  <circle cx="25" cy="33" r="2" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="39" cy="33" r="2" fill="#00ff88" filter="url(#glow)"/>
  <!-- antena/headphone -->
  <rect x="11" y="30" width="3" height="10" rx="1.5" fill="url(#g)"/>
  <rect x="50" y="30" width="3" height="10" rx="1.5" fill="url(#g)"/>
  <!-- shhh boca -->
  <path d="M28 42 Q32 44 36 42" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
