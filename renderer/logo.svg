<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#00f0d0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- moldura -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#000" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>
  <!-- capuz -->
  <path d="M16 28 Q32 12 48 28 L48 44 Q32 50 16 44 Z" fill="#0a1a12" stroke="url(#g)" stroke-width="1.5"/>
